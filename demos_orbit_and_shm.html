    last = 0; acc = 0;
    if (playing) raf = requestAnimationFrame(tick);
    else if (raf) cancelAnimationFrame(raf);
  };
  sl.oninput = function(){
    playing=false; btn.textContent="Play"; if (raf) cancelAnimationFrame(raf);
    frame = +sl.value; draw(frame);
  };
  if (N) draw(0);
})();
</script>
</body>
