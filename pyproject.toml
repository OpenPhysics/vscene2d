[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vscene2d"
version = "0.2.0"
description = "VPython-style 2D physics scenes that run natively in Jupyter"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
live = ["ipycanvas>=0.13", "ipywidgets>=8"]

[tool.setuptools.packages.find]
include = ["vscene2d*"]
