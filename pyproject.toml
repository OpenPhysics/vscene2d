[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vscene2d"
version = "0.3.0"
description = "VPython-style 2D physics scenes that run natively in Jupyter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["physics", "simulation", "jupyter", "vpython", "education", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/OpenPhysics/vscene2d"
Source = "https://github.com/OpenPhysics/vscene2d"
Issues = "https://github.com/OpenPhysics/vscene2d/issues"

[project.optional-dependencies]
live = ["ipycanvas>=0.13", "ipywidgets>=8", "jupyter-ui-poll>=1.0"]

[tool.setuptools.packages.find]
include = ["vscene2d*"]
